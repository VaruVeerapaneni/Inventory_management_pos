name: Build and Release Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Executable Shaded JAR with Maven
        run: mvn clean package -DskipTests

      - name: Create Release Distribution Bundle
        shell: pwsh
        run: |
          $releaseDir = "release-bundle"
          New-Item -ItemType Directory -Path $releaseDir -Force
          Copy-Item -Path "target/inventory-2.0.1.jar" -Destination "$releaseDir/inventory-2.0.1.jar"
          Copy-Item -Path "inventory.sql" -Destination "$releaseDir/inventory.sql"
          Copy-Item -Path "src/main/resources/application.properties" -Destination "$releaseDir/application.properties"
          if (Test-Path "run.bat") { Copy-Item -Path "run.bat" -Destination "$releaseDir/run.bat" }
          if (Test-Path "run.sh") { Copy-Item -Path "run.sh" -Destination "$releaseDir/run.sh" }
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination "$releaseDir/README.md" }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "Inventory-POS-v2.0.1.zip" -Force

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-POS-v2.0.1
          path: Inventory-POS-v2.0.1.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Inventory POS Release v2.0.1' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Inventory-POS-v2.0.1.zip
            target/inventory-2.0.1.jar
            inventory.sql
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
